# Ambiente de desenvolvimento completo. Só precisa de Docker:
#   docker compose up --watch
# App: http://localhost:5173 · API: http://localhost:4000 · E-mails: http://localhost:8025
# Alterações em backend/src, frontend/src e conteudo/ são aplicadas sozinhas (--watch).
# Portas só em 127.0.0.1: senha do banco, JWT_SECRET e Mailpit de dev não ficam visíveis na rede Wi-Fi.
# Para abrir o app no celular, troque a porta do web para '5173:5173' e acesse http://<IP da máquina>:5173.
name: guardiao-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: security_awareness
    ports:
      - '127.0.0.1:5432:5432' # para rodar os testes do backend a partir da máquina
    volumes:
      - db:/var/lib/postgresql/data
      - ./deploy/dev-init.sql:/docker-entrypoint-initdb.d/dev-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d security_awareness']
      interval: 3s
      retries: 20

  # Caixa de e-mail falsa: recebe o e-mail de redefinição de senha.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:8025:8025'

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://app:app@db:5432/security_awareness
      TEST_DATABASE_URL: postgres://app:app@db:5432/security_awareness_teste
      JWT_SECRET: segredo-so-para-desenvolvimento-local-0123456789
      APP_URL: http://localhost:5173
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_REMETENTE: Guardião Impacta <no-reply@guardiao.local>
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /app/src
        - action: sync
          path: ./backend/test
          target: /app/test
        # Aulas novas ou editadas em conteudo/ são importadas ao reiniciar a API.
        - action: sync+restart
          path: ./conteudo
          target: /app/conteudo
        - action: rebuild
          path: ./backend/package.json

  web:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://api:4000
    ports:
      - '127.0.0.1:5173:5173'
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: sync+restart
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync+restart
          path: ./frontend/vite.config.js
          target: /app/vite.config.js
        - action: rebuild
          path: ./frontend/package.json

volumes:
  db:
