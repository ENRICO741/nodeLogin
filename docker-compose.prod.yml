# Produção (VM Azure). Na raiz do repositório, com o arquivo .env preenchido (veja .env.example):
#   docker compose -f docker-compose.prod.yml up -d --build
# Para conferir o build de produção na sua máquina, sem domínio nem HTTPS:
#   DOMAIN=:80 APP_URL=http://localhost docker compose -f docker-compose.prod.yml up -d --build
name: guardiao

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-security_awareness}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-security_awareness}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRA_EM: ${JWT_EXPIRA_EM:-7d}
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      SMTP_REMETENTE: ${SMTP_REMETENTE:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      # Domínio real = HTTPS automático (Let's Encrypt). ":80" = só HTTP, para teste local.
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db:
  caddy-data:
  caddy-config:
