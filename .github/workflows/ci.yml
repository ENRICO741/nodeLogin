name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: security_awareness_teste
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Lint e formatação
        run: npm ci && npx eslint . && npx prettier --check .

      - name: Backend (testes de integração)
        working-directory: backend
        run: npm ci && npm run test:cobertura

      - name: Frontend (testes e build)
        working-directory: frontend
        run: npm ci && npm run test:cobertura && npm run build
