name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: security_awareness_teste
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Lint e formatação
        run: npm ci && npx eslint . && npx prettier --check .

      - name: Aulas (valida conteudo/aulas)
        working-directory: backend
        run: npm ci && npm run importar-aulas -- --validar

      - name: Backend (testes de integração)
        working-directory: backend
        run: npm ci && npm run test:cobertura

      - name: Frontend (testes e build)
        working-directory: frontend
        run: npm ci && npm run test:cobertura && npm run build

  # Push no main com tudo verde: roda o deploy.sh na VM pelo Run Command do Azure.
  # A porta 22 continua fechada para a internet; o login no Azure é por OIDC (sem segredo guardado).
  # Fica pulado até as variables AZURE_* existirem no repositório.
  deploy:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: https://guardiaoimpacta.brazilsouth.cloudapp.azure.com
    # Um deploy por vez, na ordem dos pushes (nunca cancela um que já começou).
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy na VM
        env:
          COMMIT: ${{ github.sha }}
        run: |
          # Atualiza o código antes de rodar o deploy.sh: o sh lê o script aos poucos e não pode vê-lo mudar no meio.
          # O Run Command devolve sucesso mesmo se o script falhar: o resultado vem pela saída.
          saida=$(az vm run-command invoke -g TCC -n guardiao-vm --command-id RunShellScript \
            --scripts "sudo -iu azureuser sh -c 'cd /opt/guardiao && git fetch -q origin main && git merge -q --ff-only $COMMIT && deploy/deploy.sh $COMMIT'" \
            --query 'value[0].message' -o tsv)
          echo "$saida"
          echo "$saida" | grep -q '==> Deploy concluído'
